/* Match the customer preview device geometry; only the inner app scrolls. */
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#e5e9e6;color:#263d33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.preview-switch{display:flex;flex-shrink:0;gap:6px;padding:4px;margin:8px 0 10px;border-radius:16px;background:#d4ded6}
.preview-switch a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 20px;border-radius:12px;color:#315f44;font-size:14px;text-decoration:none}
.preview-switch a[aria-current=page]{background:#315f44;color:white;font-weight:600}
.preview-switch a:focus-visible,button:focus-visible{outline:3px solid #bb8426;outline-offset:2px}
.device{flex-shrink:0;width:min(398px,calc(100vw - 28px));height:min(816px,calc(100dvh - 112px));padding:9px;background:#242b28;border-radius:43px;border:2px solid #5b635e;box-shadow:0 20px 50px #263c3325,inset 0 0 0 2px #101713;position:relative}
.side-key{position:absolute;right:-5px;top:140px;height:58px;width:4px;border-radius:0 3px 3px 0;background:#454d48}
.device::before{content:"";position:absolute;left:-5px;top:110px;width:4px;height:80px;border-radius:3px 0 0 3px;background:#454d48}
.device-screen{width:100%;height:100%;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;background:#f7f9f6}
.statusbar{flex:0 0 33px;position:relative;padding:7px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
.speaker{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:78px;height:18px;border-radius:20px;background:#202924}
.device .bar{flex:0 0 60px;padding:5px 15px;font-size:16px;border-bottom:1px solid #e5ebe4}
.device .bar button{min-width:44px;min-height:44px;font-size:14px}
.device .screen{flex:1;min-height:0;height:auto;max-height:none;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c9d4cb transparent;background:#f7f9f6;font-size:15px}
.device .screen .page{padding:15px 16px 20px}
.device .title{font-size:22px;letter-spacing:0}
.device .subtitle{font-size:13px;margin:8px 0 16px}
.device .section{font-size:16px;margin:20px 0 12px}
.device .card{padding:15px;border-radius:13px;margin-bottom:12px;border-color:#dde6dc}
.device .hero{background:#315f44}
.device .eyebrow,.device .hint,.device .small,.device .label{font-size:12px;letter-spacing:0}
.device .number{font-size:28px}
.device .screen button{font-size:14px;min-height:44px;line-height:1.5;padding:10px 12px;border-radius:11px}
.device .screen .hero button{color:#315f44}
.device .screen .row button{flex-shrink:0}
.device .screen .week-row{white-space:normal;font-size:13px}
.device .screen input,.device .screen textarea,.device .screen select,.device .picker{font-size:15px;min-height:44px;padding:10px;border-radius:11px}
.device .screen .clock{font-size:16px;min-width:52px}
.device .screen .customer{font-size:15px}
.device .screen .badge{font-size:11px}
.device .tabs{position:static;flex:0 0 58px;padding:3px 8px 0;gap:2px}
.device .tabs button{font-size:12px;min-width:0;min-height:44px;line-height:1.4;padding:5px 0;border-radius:8px}
.device .tabs button.active{color:#2c6040;background:#e7f0e6}
.home-indicator{flex:0 0 18px;background:white;display:flex;justify-content:center;align-items:center}
.home-indicator i{width:100px;height:4px;border-radius:9px;background:#28382e}
.preview-note{font-size:11px;color:#637268;padding:0;margin:10px 0 0}
@media(max-width:360px){.device{width:calc(100vw - 16px);padding:7px;border-radius:35px}.device-screen{border-radius:26px}.device .screen .page{padding-left:12px;padding-right:12px}}
@media(max-height:650px){.preview-note{display:none}}
