<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Yifan Zhu — Research-led Multidisciplinary Designer." />
<meta name="theme-color" content="#f4f3ef" />

<body class="hv is-loading">
<div class="hv-loader"><p class="hv-loader-n"><span data-t="name"></span><span data-t="role"></span></p></div>
<header class="hv-head">
  <a class="hv-name" href="home-v4.html" data-t="name"></a>
  <p class="hv-role" data-t="role"></p>
  <nav class="hv-nav">
    <a href="#work" data-t="nav_work"></a>
    <a href="about.html" data-t="nav_about"></a>
    <a href="#contact" data-t="nav_contact"></a>
    <button type="button" class="hv-lang"><span data-l="en">EN</span><span data-l="zh">中文</span></button>
  </nav>
</header>
<main id="main">
  <section class="hv-hero">
    <div class="hv-hero-pin">
      <div class="hv-hero-card">
        <video class="hv-hero-v" src="assets/v3/blender-reel-web.mp4" poster="assets/v3/blender-reel.jpg" muted loop playsinline autoplay></video>
        <div class="hv-hero-in">
          <p class="hv-hero-t" data-t="statement" data-lines></p>
          <p class="hv-hero-s" data-t="scroll"></p>
        </div>
      </div>
    </div>
  </section>

  <div class="hv-sheet">
    <section class="hv-where">
      <p data-reveal><span data-t="raised"></span> <b class="hv-todo" data-t="todo"></b><br><span data-t="designing"></span> <b class="hv-todo" data-t="todo"></b></p>
      <p class="hv-ast" data-reveal>*</p>
      <p data-reveal><span data-t="now1"></span> <a class="hv-at" href="project-glasgow-booking.html" data-t="now_at"></a><br><span data-t="now2"></span></p>
      <p data-reveal><span data-t="former"></span> <b class="hv-todo" data-t="todo"></b></p>
    </section>

    <section class="hv-type" data-toy>
      <canvas class="hv-toy-gl" aria-hidden="true"></canvas>
      <h2 class="hv-big" data-big><span class="hv-cycle"><span></span></span><span data-t="type2"></span><span data-t="type3"></span></h2>
      <p class="hv-hint" data-t="toy_hint"></p>
    </section>

    <section class="hv-hello">
      <p class="hv-hello-a" data-t="hello" data-lines></p>
      <div class="hv-hello-b"><span class="hv-ast">*</span><div><p data-t="hi1" data-reveal></p><p data-t="hi2" data-reveal></p></div></div>
    </section>

    <section class="hv-reel">
      <button type="button" class="hv-reel-card" data-reel>
        <video muted loop playsinline preload="none" data-reel-v></video>
        <span class="hv-reel-type" aria-hidden="true"><span data-t="reel_w1"></span><span data-t="reel_w2"></span></span>
        <span class="hv-pill" data-t="watch_reel"></span>
      </button>
    </section>

    <section class="hv-work" id="work">
      <h2 class="hv-work-h" data-t="selected"></h2>
      <div class="hv-projects" data-set="0"></div>
    </section>

    <section class="hv-inter">
      <div class="hv-inter-pin">
        <img src="assets/v3/modeling-02.jpg" alt="" loading="lazy" />
        <h2 class="hv-big hv-fill" data-fill><span data-t="inter1"></span><span data-t="inter2"></span><span data-t="inter3"></span></h2>
      </div>
    </section>

    <section class="hv-work">
      <div class="hv-projects" data-set="1"></div>
      <h2 class="hv-work-h hv-arch-h" data-t="archives"></h2>
      <ol class="hv-archive"></ol>
    </section>

    <section class="hv-end" id="contact" data-toy>
      <canvas class="hv-toy-gl" aria-hidden="true"></canvas>
      <h2 class="hv-big hv-end-h" data-big><span data-t="end1"></span><span data-t="end2"></span><span data-t="end3"></span></h2>
      <p class="hv-end-links"><a href="mailto:zhuyifan001225@gmail.com">zhuyifan001225@gmail.com</a><a href="about.html" data-t="nav_about"></a><a href="work.html" data-t="all_work"></a></p>
      <p class="hv-foot"><span>© 2026</span><span data-t="name"></span></p>
    </section>
  </div>
</main>
<div class="hv-drag" aria-hidden="true" data-t="drag"></div>
<dialog class="hv-player"><button type="button" class="hv-player-x">×</button><video controls playsinline preload="none"></video></dialog>
<script type="module" src="scripts/home-v4.mjs"></script>
</body>
</html>
