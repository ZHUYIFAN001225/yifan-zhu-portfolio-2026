<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:transparent">
<canvas id="c" width="1400" height="1400"></canvas>
<script type="module">
import * as THREE from '../assets/v3/lib/three/three.module.min.js';
import { RoomEnvironment } from '../assets/v3/lib/three/RoomEnvironment.js';
const c = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setClearColor(0, 0); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
const cam = new THREE.PerspectiveCamera(28, 1, .1, 100); cam.position.set(0, 0, 11);
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3, 5, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xc8ffe8, 1.6); rim.position.set(5, -2, -4); scene.add(rim);
const steel = new THREE.MeshPhysicalMaterial({ color: 0xd9dde0, metalness: 1, roughness: .18, clearcoat: .5 });
const mat = (color, rough = .4) => new THREE.MeshPhysicalMaterial({ color, roughness: rough, clearcoat: .4, clearcoatRoughness: .3 });
const rr = (w, h, rad) => { const s = new THREE.Shape(), x = -w/2, y = -h/2; s.moveTo(x+rad,y); s.lineTo(x+w-rad,y); s.quadraticCurveTo(x+w,y,x+w,y+rad); s.lineTo(x+w,y+h-rad); s.quadraticCurveTo(x+w,y+h,x+w-rad,y+h); s.lineTo(x+rad,y+h); s.quadraticCurveTo(x,y+h,x,y+h-rad); s.lineTo(x,y+rad); s.quadraticCurveTo(x,y,x+rad,y); return s; };
const B = {
  scissors(handle) {
    const g = new THREE.Group();
    const blade = side => { const s = new THREE.Shape(); s.moveTo(0, -.16); s.lineTo(3.1, -.03 * side); s.quadraticCurveTo(3.3, .02, 3.1, .06); s.lineTo(0, .2); s.lineTo(0, -.16);
      return new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: .07, bevelEnabled: true, bevelThickness: .02, bevelSize: .03, bevelSegments: 3 }), steel); };
    const arm = sgn => { const a = new THREE.Group();
      a.add(blade(sgn));
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(.11, .14, 1.0, 24), steel); neck.rotation.z = Math.PI / 2; neck.position.set(-.5, 0, .03); a.add(neck);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.52, .13, 32, 96), mat(handle, .35)); ring.scale.set(1.15, .8, 1); ring.position.set(-1.55, 0, .03); a.add(ring);
      a.rotation.z = sgn * .16; a.position.z = sgn * .06; return a; };
    g.add(arm(1), arm(-1));
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, .3, 32), steel); pin.rotation.x = Math.PI / 2; g.add(pin);
    g.position.x = .5; return g;
  },
  comb(color) {
    const g = new THREE.Group(), m = mat(color, .3);
    const spine = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(4.6, .5, .22), { depth: .14, bevelEnabled: true, bevelSize: .03, bevelThickness: .03 }), m); spine.position.y = .55; g.add(spine);
    for (let i = 0; i < 30; i++) { const len = i < 14 ? 1.2 : .95; const t = new THREE.Mesh(new THREE.BoxGeometry(.07, len, .12), m); t.position.set(-2.15 + i * .148, .3 - len / 2, .07); g.add(t); }
    return g;
  },
  async phone(screen) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(2.3, 4.7, .42), { depth: .22, bevelEnabled: true, bevelSize: .05, bevelThickness: .05, bevelSegments: 6 }), new THREE.MeshPhysicalMaterial({ color: 0x8e9398, metalness: 1, roughness: .25 }));
    body.position.z = -.22; g.add(body);
    const glass = new THREE.Mesh(new THREE.ShapeGeometry(rr(2.26, 4.66, .4)), new THREE.MeshPhysicalMaterial({ color: 0x050607, roughness: .1, clearcoat: 1 })); glass.position.z = .056; g.add(glass);
    const tex = await new THREE.TextureLoader().loadAsync(screen); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const geo = new THREE.ShapeGeometry(rr(2.08, 4.48, .3)); const pos = geo.attributes.position, uv = geo.attributes.uv; for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + 1.04) / 2.08, (pos.getY(i) + 2.24) / 4.48);
    const scr = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })); scr.position.z = .065; g.add(scr);
    const isl = new THREE.Mesh(new THREE.CapsuleGeometry(.09, .42, 8, 24), new THREE.MeshBasicMaterial({ color: 0 })); isl.rotation.z = Math.PI / 2; isl.position.set(0, 2.05, .07); g.add(isl);
    return g;
  },
  diary() {
    const g = new THREE.Group();
    const cover = new THREE.Mesh(new THREE.BoxGeometry(3.2, 4.2, .12), mat(0x17362b, .55)); cover.position.z = -.12; g.add(cover);
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 840; const x = cv.getContext('2d');
    x.fillStyle = '#fbf8ef'; x.fillRect(0, 0, 640, 840); x.strokeStyle = '#c9d7e8'; x.lineWidth = 2; for (let y = 120; y < 840; y += 46) { x.beginPath(); x.moveTo(0, y); x.lineTo(640, y); x.stroke(); }
    x.strokeStyle = '#e4a3a3'; x.beginPath(); x.moveTo(90, 0); x.lineTo(90, 840); x.stroke();
    x.fillStyle = '#27408f'; x.font = 'italic 34px Georgia'; ['Sat 3 Oct', '10:00 Chen · short', '11:00 Emma · long', '14:00 Wang · colour', '16:00 Li (WeChat)'].forEach((t, i) => x.fillText(t, 110, 108 + i * 92));
    x.strokeStyle = '#d0453b'; x.lineWidth = 3; x.beginPath(); x.moveTo(110, 190); x.lineTo(420, 180); x.stroke(); x.fillStyle = '#d0453b'; x.fillText('?', 520, 384);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const side = mat(0xf3efe4, .8);
    const page = new THREE.Mesh(new THREE.BoxGeometry(3.05, 4.05, .14), [side, side, side, side, new THREE.MeshStandardMaterial({ map: tex, roughness: .85 }), side]); page.position.set(.05, 0, .02); g.add(page);
    for (let i = 0; i < 9; i++) { const ring = new THREE.Mesh(new THREE.TorusGeometry(.16, .035, 12, 32), steel); ring.rotation.y = Math.PI / 2; ring.position.set(-1.56, 1.7 - i * .42, 0); g.add(ring); }
    return g;
  },
  pencil() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, 4, 6), mat(0xf1b93f, .45)));
    const wood = new THREE.Mesh(new THREE.ConeGeometry(.16, .55, 6), mat(0xe9c79a, .7)); wood.position.y = -2.27; wood.rotation.x = Math.PI; g.add(wood);
    const lead = new THREE.Mesh(new THREE.ConeGeometry(.05, .18, 12), mat(0x222222, .4)); lead.position.y = -2.47; lead.rotation.x = Math.PI; g.add(lead);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(.17, .17, .3, 24), steel); band.position.y = 2.15; g.add(band);
    const er = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .3, 24), mat(0xe58a8a, .7)); er.position.y = 2.45; g.add(er);
    return g;
  }
};
window.shoot = async (kind, arg, rot, zoom = 1) => {
  scene.children.filter(o => o.isGroup).forEach(o => scene.remove(o));
  const g = await B[kind](arg); g.rotation.set(...rot); g.scale.setScalar(zoom); scene.add(g);
  r.render(scene, cam); return c.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
